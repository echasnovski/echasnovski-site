meta:
  name:
    full: Evgeni Chasnovski
  link:
    home: https://www.echasnovski.com
    github: https://github.com/echasnovski
    bluesky: https://bsky.app/profile/echasnovski.com

color:
  palette:
    bg:      "#12171A" # OKLch: 10 1 240
    bg-2:    "#1E2327" # OKLch: 15 1 240
    fg:      "#D5D5CE" # OKLch: 85 1 110
    fg-2:    "#E3E3DC" # OKLch: 90 1 110
    grey-bg: "#222222" # OKLch: 15 0
    grey:    "#D4D4D4" # OKLch: 85 0
    comment: "#919191" # OKLch: 60 0
    black:   "#020406" # OKLch:  3 1 240
    red:     "#FFC0C4" # OKLch: 85 8  15
    green:   "#B4E3B5" # OKLch: 85 8 145
    yellow:  "#E0D699" # OKLch: 85 8 100
    blue:    "#A1DDFF" # OKLch: 85 8 235
    magenta: "#F0C3F2" # OKLch: 85 8 325
    cyan:    "#94E6E5" # OKLch: 85 8 190
    white:   "#F7F7F0" # OKLch: 97 1 110

  foreground: fg
  background: bg
  primary: blue
  secondary: green
  tertiary: magenta
  success: green
  info: cyan
  warning: yellow
  danger: red
  light: white
  dark: black

typography:
  fonts:
  - family: Ubuntu
    source: google

  base:
    family: Ubuntu
  headings:
    weight: bold
    color: primary
  monospace:
    family: monospace
    background-color: bg-2
  monospace-inline:
    color: grey
    background-color: bg-2
  link:
    color: cyan
    decoration: underline

defaults:
  bootstrap:
    defaults:
      navbar-bg: $brand-bg-2
      navbar-fg: $brand-fg-2
      code-block-bg: $brand-bg-2
